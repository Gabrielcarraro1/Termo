<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f6f7f8">
    <title>Termo</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, Helvetica, sans-serif;
            color: #24292e;
            background: #f6f7f8;
            --border: #d3d6da;
            --green: #6aaa64;
            --yellow: #c9b458;
            --red: #d9534f;
            --dark: #202124;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 32px 16px;
            display: flex;
            justify-content: center;
        }

        main {
            width: min(100%, 430px);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            width: 100%;
            margin: 0 0 28px;
            padding: 0 0 18px;
            border-bottom: 1px solid var(--border);
            text-align: center;
            font-size: 1.65rem;
            letter-spacing: .16em;
        }

        #jogo {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .guess-form {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin: 0;
            width: 100%;
        }

        .guess-rows {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .tile-row {
            display: flex;
            justify-content: center;
            gap: 7px;
        }

        .tile-wrap {
            position: relative;
            width: 54px;
            height: 54px;
        }

        .letter-tile {
            width: 100%;
            height: 100%;
            padding: 0;
            border: 2px solid var(--border);
            border-radius: 4px;
            background: #fff;
            color: #24292e;
            text-align: center;
            text-transform: uppercase;
            font-size: 1.5rem;
            font-weight: 700;
            outline: none;
            transition: background-color .18s ease, border-color .18s ease, color .18s ease;
        }

        .letter-tile:focus {
            border-color: #858b92;
        }

        .letter-tile:disabled {
            color: var(--dark);
            background: #fff;
            opacity: 1;
            cursor: default;
        }

        .letter-tile.tile--error {
            color: var(--red) !important;
            border-color: var(--red) !important;
            background: #fff !important;
        }

        .error-mark {
            position: absolute;
            inset: 0;
            display: grid;
            place-items: center;
            color: var(--red);
            font-size: 2rem;
            font-weight: 400;
            pointer-events: none;
            opacity: 0;
        }

        .tile-wrap.is-missing .error-mark {
            animation: error-mark .42s ease both;
        }

        @keyframes error-mark {
            0% { opacity: 0; transform: scale(.35) rotate(-20deg); }
            35% { opacity: 1; transform: scale(1.12) rotate(0); }
            75% { opacity: 1; transform: scale(1); }
            100% { opacity: 0; transform: scale(.9); }
        }

        .submit-button {
            min-width: 116px;
            padding: 10px 18px;
            border: 0;
            border-radius: 4px;
            background: var(--dark);
            color: #fff;
            font-size: .95rem;
            font-weight: 700;
            cursor: pointer;
        }

        .submit-button:hover { background: #41474d; }
        .submit-button:focus-visible { outline: 3px solid #9aa0a6; outline-offset: 3px; }
        .submit-button:disabled { opacity: .55; cursor: not-allowed; }

        .used-letters {
            margin-top: 30px;
            text-align: center;
        }

        .used-letters h2 {
            margin: 0 0 10px;
            color: #62676d;
            font-size: .85rem;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        #letrasUtilizadas {
            min-height: 24px;
            color: #454a50;
            font-size: 1rem;
            letter-spacing: .2em;
            overflow-wrap: anywhere;
        }

        #confetes {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 5;
        }

        .confete {
            position: absolute;
            bottom: -16px;
            width: 8px;
            height: 12px;
            border-radius: 2px;
            animation: subir 2.8s ease-out forwards;
        }

        @keyframes subir {
            from { transform: translate3d(0, 0, 0) rotate(0); opacity: 1; }
            to { transform: translate3d(var(--drift), -110vh, 0) rotate(var(--spin)); opacity: 0; }
        }

        @media (max-width: 380px) {
            .tile-wrap { width: 48px; height: 48px; }
            .tile-row { gap: 5px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>TERMO</h1>
        <div id="jogo" aria-label="Tabuleiro do jogo"></div>
        <section class="used-letters" aria-labelledby="used-letters-title">
            <h2 id="used-letters-title">Letras utilizadas</h2>
            <div id="letrasUtilizadas" aria-live="polite"></div>
        </section>
    </main>
    <div id="confetes" aria-hidden="true"></div>
    <script src="termo.js"></script>
</body>
</html>
